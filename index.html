<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão da Tutoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }
        .event-details {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            color: #ffffff;
        }
        .observation {
            background-color: #3d3d3d;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            color: #ffffff;
        }
        .calendar-container {
            margin-top: 20px;
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 5px;
        }
        .form-container {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .color-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-option.selected {
            border-color: #ffffff;
        }
        .form-control {
            background-color: #3d3d3d;
            border: 1px solid #4d4d4d;
            color: #ffffff;
        }
        .form-control:focus {
            background-color: #4d4d4d;
            border-color: #5d5d5d;
            color: #ffffff;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        .fc {
            background-color: #2d2d2d;
            color: #ffffff;
        }
        .fc-toolbar-title {
            color: #ffffff;
        }
        .fc-button-primary {
            background-color: #3d3d3d;
            border-color: #4d4d4d;
            color: #ffffff;
        }
        .fc-button-primary:hover {
            background-color: #4d4d4d;
            border-color: #5d5d5d;
        }
        .fc-daygrid-day {
            background-color: #2d2d2d;
        }
        .fc-day-today {
            background-color: #3d3d3d !important;
        }
        .fc-event {
            border-radius: 3px;
            padding: 2px 4px;
            margin: 1px 0;
        }
        .fc-event-title {
            font-weight: bold;
        }
        .fc-event-time {
            font-size: 0.8em;
        }
        .fc-event.menção-marker {
            margin-left: 2px;
            margin-right: 2px;
            font-size: 0.8em;
            padding: 1px 4px;
            border-radius: 2px;
        }
        .fc-event.main-event {
            margin-bottom: 2px;
        }
        .fc-event.menção-parcial {
            background-color: #ffc107;
            border-color: #ffc107;
        }
        .fc-event.menção-final {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .fc-event.menção-marker .fc-event-title {
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Gestão da Tutoria</h1>
        
        <div class="calendar-container">
            <div id="calendar"></div>
        </div>

        <div class="form-container">
            <h3>Cadastro de Turma</h3>
            <form id="eventForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="turma" class="form-label">Turma</label>
                        <input type="text" class="form-control" id="turma" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="uc" class="form-label">UC</label>
                        <input type="text" class="form-control" id="uc" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="ciclo" class="form-label">Ciclo</label>
                        <input type="text" class="form-control" id="ciclo" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="mençãoParcial" class="form-label">Menção Parcial</label>
                        <input type="date" class="form-control" id="mençãoParcial">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="mençãoFinal" class="form-label">Menção Final</label>
                        <input type="date" class="form-control" id="mençãoFinal">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="dataInicio" class="form-label">Data de Início</label>
                        <input type="date" class="form-control" id="dataInicio" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="dataFinal" class="form-label">Data Final</label>
                        <input type="date" class="form-control" id="dataFinal" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cor do Evento</label>
                        <div class="color-selector">
                            <div class="color-option selected" style="background-color: #3788d8;" data-color="#3788d8"></div>
                            <div class="color-option" style="background-color: #6c757d;" data-color="#6c757d"></div>
                            <div class="color-option" style="background-color: #28a745;" data-color="#28a745"></div>
                            <div class="color-option" style="background-color: #dc3545;" data-color="#dc3545"></div>
                            <div class="color-option" style="background-color: #ffc107;" data-color="#ffc107"></div>
                        </div>
                        <input type="hidden" id="eventColor" value="#3788d8">
                    </div>
                </div>
                <button type="submit" class="btn btn-dark">Cadastrar Turma</button>
            </form>
        </div>

        <!-- Modal para detalhes do evento -->
        <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="background-color: #2d2d2d; color: #ffffff;">
                    <div class="modal-header" style="border-bottom: 1px solid #4d4d4d;">
                        <h5 class="modal-title" id="eventModalLabel">Detalhes da Turma</h5>
                        <div>
                            <button type="button" class="btn btn-primary me-2" id="editEvent">
                                <i class="bi bi-pencil"></i> Editar
                            </button>
                            <button type="button" class="btn btn-danger me-2" id="deleteEvent">
                                <i class="bi bi-trash"></i> Excluir
                            </button>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter: invert(1);"></button>
                        </div>
                    </div>
                    <div class="modal-body">
                        <div id="eventInfo"></div>
                        <div id="editForm" style="display: none;">
                            <form id="editEventForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="editTurma" class="form-label">Turma</label>
                                        <input type="text" class="form-control" id="editTurma" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="editUc" class="form-label">UC</label>
                                        <input type="text" class="form-control" id="editUc" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="editCiclo" class="form-label">Ciclo</label>
                                        <input type="text" class="form-control" id="editCiclo" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="editMençãoParcial" class="form-label">Menção Parcial</label>
                                        <input type="date" class="form-control" id="editMençãoParcial">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="editMençãoFinal" class="form-label">Menção Final</label>
                                        <input type="date" class="form-control" id="editMençãoFinal">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="editDataInicio" class="form-label">Data de Início</label>
                                        <input type="date" class="form-control" id="editDataInicio" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="editDataFinal" class="form-label">Data Final</label>
                                        <input type="date" class="form-control" id="editDataFinal" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Cor do Evento</label>
                                        <div class="color-selector">
                                            <div class="color-option selected" style="background-color: #3788d8;" data-color="#3788d8"></div>
                                            <div class="color-option" style="background-color: #6c757d;" data-color="#6c757d"></div>
                                            <div class="color-option" style="background-color: #28a745;" data-color="#28a745"></div>
                                            <div class="color-option" style="background-color: #dc3545;" data-color="#dc3545"></div>
                                            <div class="color-option" style="background-color: #ffc107;" data-color="#ffc107"></div>
                                        </div>
                                        <input type="hidden" id="editEventColor" value="#3788d8">
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-secondary me-2" id="cancelEdit">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                                </div>
                            </form>
                        </div>
                        <div class="mt-3" id="observationsSection">
                            <h6>Observações</h6>
                            <div id="observationsList"></div>
                            <form id="observationForm" class="mt-3">
                                <div class="mb-3">
                                    <label for="newObservation" class="form-label">Nova Observação</label>
                                    <textarea class="form-control" id="newObservation" rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-secondary">Adicionar Observação</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let events = JSON.parse(localStorage.getItem('events')) || [];
            let selectedEventId = null;
            const eventModal = new bootstrap.Modal(document.getElementById('eventModal'));

            // Color selector functionality
            const colorOptions = document.querySelectorAll('.color-option');
            colorOptions.forEach(option => {
                option.addEventListener('click', function() {
                    colorOptions.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('eventColor').value = this.dataset.color;
                });
            });

            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'pt-br',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,dayGridWeek'
                },
                buttonText: {
                    today: 'Hoje',
                    month: 'Mês',
                    week: 'Semana'
                },
                events: events.map(event => {
                    const events = [{
                        id: event.id,
                        title: `${event.turma} - ${event.uc}`,
                        start: event.dataInicio,
                        end: new Date(new Date(event.dataFinal).setDate(new Date(event.dataFinal).getDate() + 1)),
                        color: event.color,
                        extendedProps: event,
                        display: 'block',
                        classNames: ['main-event']
                    }];

                    // Adiciona menção parcial se existir e estiver dentro do intervalo
                    if (event.mençãoParcial && 
                        new Date(event.mençãoParcial) >= new Date(event.dataInicio) && 
                        new Date(event.mençãoParcial) <= new Date(event.dataFinal)) {
                        events.push({
                            id: `${event.id}-parcial`,
                            title: `Menção Parcial`,
                            start: event.mençãoParcial,
                            end: new Date(new Date(event.mençãoParcial).setDate(new Date(event.mençãoParcial).getDate() + 1)),
                            allDay: true,
                            color: '#ffc107',
                            textColor: '#000000',
                            classNames: ['menção-marker', 'menção-parcial'],
                            extendedProps: {
                                ...event,
                                isMenção: true,
                                tipo: 'parcial'
                            }
                        });
                    }

                    // Adiciona menção final se existir e estiver dentro do intervalo
                    if (event.mençãoFinal && 
                        new Date(event.mençãoFinal) >= new Date(event.dataInicio) && 
                        new Date(event.mençãoFinal) <= new Date(event.dataFinal)) {
                        events.push({
                            id: `${event.id}-final`,
                            title: `Menção Final`,
                            start: event.mençãoFinal,
                            end: new Date(new Date(event.mençãoFinal).setDate(new Date(event.mençãoFinal).getDate() + 1)),
                            allDay: true,
                            color: '#dc3545',
                            textColor: '#ffffff',
                            classNames: ['menção-marker', 'menção-final'],
                            extendedProps: {
                                ...event,
                                isMenção: true,
                                tipo: 'final'
                            }
                        });
                    }

                    return events;
                }).flat(),
                eventClick: function(info) {
                    selectedEventId = info.event.extendedProps.id;
                    showEventDetails(info.event.extendedProps);
                    eventModal.show();
                },
                eventDisplay: 'block',
                eventTimeFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    meridiem: false
                }
            });
            calendar.render();

            // Atualiza o estilo dos eventos
            const style = document.createElement('style');
            style.textContent = `
                .fc-event.menção-marker {
                    position: absolute;
                    margin: 0;
                    padding: 1px 4px;
                    border-radius: 2px;
                    font-size: 0.8em;
                    z-index: 3;
                    box-shadow: 0 0 2px rgba(0,0,0,0.3);
                    pointer-events: auto;
                    width: auto !important;
                    min-width: 80px;
                }
                .fc-event.main-event {
                    position: relative;
                    z-index: 1;
                    pointer-events: auto;
                }
                .fc-event.menção-parcial {
                    background-color: #ffc107;
                    border-color: #ffc107;
                    left: 2px;
                    top: 25%;
                    transform: translateY(-50%);
                }
                .fc-event.menção-final {
                    background-color: #dc3545;
                    border-color: #dc3545;
                    right: 2px;
                    top: 50%;
                    transform: translateY(-50%);
                }
                .fc-event.menção-marker .fc-event-title {
                    font-weight: normal;
                    white-space: nowrap;
                }
                .fc-daygrid-event {
                    position: relative;
                    pointer-events: none;
                }
                .fc-daygrid-event .fc-event-main {
                    pointer-events: auto;
                }
                .fc-event-time {
                    display: none;
                }
            `;
            document.head.appendChild(style);

            document.getElementById('eventForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const newEvent = {
                    id: Date.now().toString(),
                    turma: document.getElementById('turma').value,
                    uc: document.getElementById('uc').value,
                    ciclo: document.getElementById('ciclo').value,
                    mençãoParcial: document.getElementById('mençãoParcial').value,
                    mençãoFinal: document.getElementById('mençãoFinal').value,
                    dataInicio: document.getElementById('dataInicio').value,
                    dataFinal: document.getElementById('dataFinal').value,
                    color: document.getElementById('eventColor').value,
                    observações: []
                };

                events.push(newEvent);
                localStorage.setItem('events', JSON.stringify(events));

                // Adiciona o evento principal
                calendar.addEvent({
                    id: newEvent.id,
                    title: `${newEvent.turma} - ${newEvent.uc}`,
                    start: newEvent.dataInicio,
                    end: newEvent.dataFinal,
                    color: newEvent.color,
                    extendedProps: newEvent,
                    display: 'block',
                    classNames: ['main-event']
                });

                // Adiciona menção parcial se existir
                if (newEvent.mençãoParcial) {
                    calendar.addEvent({
                        id: `${newEvent.id}-parcial`,
                        title: `Menção Parcial`,
                        start: newEvent.mençãoParcial,
                        end: new Date(new Date(newEvent.mençãoParcial).setDate(new Date(newEvent.mençãoParcial).getDate() + 1)),
                        allDay: true,
                        color: '#ffc107',
                        textColor: '#000000',
                        classNames: ['menção-marker', 'menção-parcial'],
                        extendedProps: {
                            ...newEvent,
                            isMenção: true,
                            tipo: 'parcial'
                        }
                    });
                }

                // Adiciona menção final se existir
                if (newEvent.mençãoFinal) {
                    calendar.addEvent({
                        id: `${newEvent.id}-final`,
                        title: `Menção Final`,
                        start: newEvent.mençãoFinal,
                        end: new Date(new Date(newEvent.mençãoFinal).setDate(new Date(newEvent.mençãoFinal).getDate() + 1)),
                        allDay: true,
                        color: '#dc3545',
                        textColor: '#ffffff',
                        classNames: ['menção-marker', 'menção-final'],
                        extendedProps: {
                            ...newEvent,
                            isMenção: true,
                            tipo: 'final'
                        }
                    });
                }

                this.reset();
                document.getElementById('eventColor').value = '#3788d8';
                colorOptions[0].classList.add('selected');
                colorOptions.forEach((opt, index) => {
                    if (index !== 0) opt.classList.remove('selected');
                });
            });

            function showEventDetails(event) {
                document.getElementById('eventInfo').innerHTML = `
                    <p><strong>Turma:</strong> ${event.turma}</p>
                    <p><strong>UC:</strong> ${event.uc}</p>
                    <p><strong>Ciclo:</strong> ${event.ciclo}</p>
                    <p><strong>Data de Início:</strong> ${event.dataInicio}</p>
                    <p><strong>Data Final:</strong> ${event.dataFinal}</p>
                    <p><strong>Menção Parcial:</strong> ${event.mençãoParcial || 'Não definida'}</p>
                    <p><strong>Menção Final:</strong> ${event.mençãoFinal || 'Não definida'}</p>
                `;

                const observationsList = document.getElementById('observationsList');
                observationsList.innerHTML = '';
                event.observações.forEach(obs => {
                    const div = document.createElement('div');
                    div.className = 'observation';
                    div.textContent = obs;
                    observationsList.appendChild(div);
                });
            }

            document.getElementById('observationForm').addEventListener('submit', function(e) {
                e.preventDefault();
                if (!selectedEventId) return;

                const newObservation = document.getElementById('newObservation').value;
                if (!newObservation) return;

                const eventIndex = events.findIndex(e => e.id === selectedEventId);
                if (eventIndex !== -1) {
                    events[eventIndex].observações.push(newObservation);
                    localStorage.setItem('events', JSON.stringify(events));
                    
                    const observationsList = document.getElementById('observationsList');
                    const div = document.createElement('div');
                    div.className = 'observation';
                    div.textContent = newObservation;
                    observationsList.appendChild(div);
                    
                    document.getElementById('newObservation').value = '';
                }
            });

            // Edit functionality
            document.getElementById('editEvent').addEventListener('click', function() {
                const event = events.find(e => e.id === selectedEventId);
                if (event) {
                    document.getElementById('eventInfo').style.display = 'none';
                    document.getElementById('editForm').style.display = 'block';
                    document.getElementById('observationsSection').style.display = 'none';

                    // Preenche o formulário com os dados atuais
                    document.getElementById('editTurma').value = event.turma;
                    document.getElementById('editUc').value = event.uc;
                    document.getElementById('editCiclo').value = event.ciclo;
                    document.getElementById('editMençãoParcial').value = event.mençãoParcial || '';
                    document.getElementById('editMençãoFinal').value = event.mençãoFinal || '';
                    document.getElementById('editDataInicio').value = event.dataInicio;
                    document.getElementById('editDataFinal').value = event.dataFinal;
                    document.getElementById('editEventColor').value = event.color;

                    // Atualiza o seletor de cores
                    const colorOptions = document.querySelectorAll('#editForm .color-option');
                    colorOptions.forEach(option => {
                        option.classList.remove('selected');
                        if (option.dataset.color === event.color) {
                            option.classList.add('selected');
                        }
                    });
                }
            });

            document.getElementById('cancelEdit').addEventListener('click', function() {
                document.getElementById('eventInfo').style.display = 'block';
                document.getElementById('editForm').style.display = 'none';
                document.getElementById('observationsSection').style.display = 'block';
            });

            document.getElementById('editEventForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const eventIndex = events.findIndex(e => e.id === selectedEventId);
                if (eventIndex !== -1) {
                    const updatedEvent = {
                        ...events[eventIndex],
                        turma: document.getElementById('editTurma').value,
                        uc: document.getElementById('editUc').value,
                        ciclo: document.getElementById('editCiclo').value,
                        mençãoParcial: document.getElementById('editMençãoParcial').value || null,
                        mençãoFinal: document.getElementById('editMençãoFinal').value || null,
                        dataInicio: document.getElementById('editDataInicio').value,
                        dataFinal: document.getElementById('editDataFinal').value,
                        color: document.getElementById('editEventColor').value
                    };

                    events[eventIndex] = updatedEvent;
                    localStorage.setItem('events', JSON.stringify(events));

                    // Atualiza o evento no calendário
                    const eventToUpdate = calendar.getEventById(selectedEventId);
                    if (eventToUpdate) {
                        eventToUpdate.remove();
                    }
                    calendar.addEvent({
                        id: updatedEvent.id,
                        title: `${updatedEvent.turma} - ${updatedEvent.uc}`,
                        start: updatedEvent.dataInicio,
                        end: updatedEvent.dataFinal,
                        color: updatedEvent.color,
                        extendedProps: updatedEvent
                    });

                    // Atualiza os marcadores de menção
                    if (updatedEvent.mençãoParcial) {
                        const parcialEvent = calendar.getEventById(`${updatedEvent.id}-parcial`);
                        if (parcialEvent) {
                            parcialEvent.remove();
                        }
                        calendar.addEvent({
                            id: `${updatedEvent.id}-parcial`,
                            title: `Menção Parcial - ${updatedEvent.turma}`,
                            start: updatedEvent.mençãoParcial,
                            allDay: true,
                            color: '#ffc107',
                            textColor: '#000000',
                            classNames: ['menção-marker', 'menção-parcial'],
                            extendedProps: {
                                ...updatedEvent,
                                isMenção: true,
                                tipo: 'parcial'
                            }
                        });
                    }

                    if (updatedEvent.mençãoFinal) {
                        const finalEvent = calendar.getEventById(`${updatedEvent.id}-final`);
                        if (finalEvent) {
                            finalEvent.remove();
                        }
                        calendar.addEvent({
                            id: `${updatedEvent.id}-final`,
                            title: `Menção Final - ${updatedEvent.turma}`,
                            start: updatedEvent.mençãoFinal,
                            allDay: true,
                            color: '#dc3545',
                            textColor: '#ffffff',
                            classNames: ['menção-marker', 'menção-final'],
                            extendedProps: {
                                ...updatedEvent,
                                isMenção: true,
                                tipo: 'final'
                            }
                        });
                    }

                    // Volta para a visualização normal
                    document.getElementById('eventInfo').style.display = 'block';
                    document.getElementById('editForm').style.display = 'none';
                    document.getElementById('observationsSection').style.display = 'block';
                    showEventDetails(updatedEvent);
                }
            });

            // Delete event functionality
            document.getElementById('deleteEvent').addEventListener('click', function() {
                if (!selectedEventId) return;

                if (confirm('Tem certeza que deseja excluir esta turma?')) {
                    const eventIndex = events.findIndex(e => e.id === selectedEventId);
                    if (eventIndex !== -1) {
                        // Remove o evento principal
                        const eventToRemove = calendar.getEventById(selectedEventId);
                        if (eventToRemove) {
                            eventToRemove.remove();
                        }

                        // Remove a menção parcial se existir
                        const parcialEvent = calendar.getEventById(`${selectedEventId}-parcial`);
                        if (parcialEvent) {
                            parcialEvent.remove();
                        }

                        // Remove a menção final se existir
                        const finalEvent = calendar.getEventById(`${selectedEventId}-final`);
                        if (finalEvent) {
                            finalEvent.remove();
                        }

                        // Remove do array de eventos
                        events.splice(eventIndex, 1);
                        localStorage.setItem('events', JSON.stringify(events));
                        
                        // Fecha o modal
                        eventModal.hide();
                    }
                }
            });
        });
    </script>
</body>
